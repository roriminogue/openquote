name: Wrong price
description: A price, quantity or labour time in an estimate looks wrong
labels: [pricing]
body:
  - type: input
    id: item
    attributes:
      label: Item or job
      placeholder: "e.g. treated pine paling 100x12 1.8 m, or labour for a 20 m paling fence"
    validations:
      required: true
  - type: textarea
    id: price
    attributes:
      label: What OpenQuote AU said, and what it should be
      description: Include your region, the supplier (or your own experience) and the date.
    validations:
      required: true
