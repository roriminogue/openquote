name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen?
      placeholder: "1. Go to …\n2. Tap …\n3. See …"
  - type: input
    id: where
    attributes:
      label: Where were you using it?
      placeholder: "e.g. iPhone Safari, home screen app, Chrome on Windows"
