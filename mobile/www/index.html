<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenQuote</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fcfcfc; color: #18191b;
        font: 15px/1.5 -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      @media (prefers-color-scheme: dark) { body { background: #0f0f10; color: #f4f4f5; } }
      p { color: #6b6b74; margin: 6px 0 20px; }
      button { font: inherit; font-weight: 500; padding: 12px 20px; border-radius: 10px; border: 1px solid #262626;
        background: linear-gradient(#404040, #262626); color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px; font-weight: 600; margin: 0">Can’t reach OpenQuote</h1>
      <p>Check you’re online, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
