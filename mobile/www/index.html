<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenQuote AU</title>
    <style>
      :root { color-scheme: light dark; }
      /* Matches the app's Astryx colours: white or near-black page, orange main button with dark text. */
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #ffffff; color: #000000;
        font: 16px/1.5 -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      p { color: #474747; margin: 6px 0 20px; }
      @media (prefers-color-scheme: dark) { body { background: #262626; color: #ffffff; } p { color: #9e9e9e; } }
      button { font: inherit; font-weight: 500; min-height: 44px; padding: 10px 20px; border-radius: 10px; border: 0;
        background: #f26b1d; color: #18181b; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px; font-weight: 600; margin: 0">Can’t reach OpenQuote AU</h1>
      <p>Check you’re online, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
