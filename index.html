    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* The splash: the same logo on the same colour as iOS's launch image, kept up until the first screen is drawn
         (src/lib/splash.ts), so opening the app shows one steady frame instead of icon, logo and blank in turn. */
      @font-face {
        font-family: "Figtree Splash";
        src: url("/fonts/figtree-latin.woff2") format("woff2");
        font-weight: 300 900;
        font-display: block;
      }
      html { background: #ffffff; --splash-ink: #000000; --splash-dim: #474747; --splash-bg: #ffffff; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background: #262626; --splash-ink: #f2f2f2; --splash-dim: #b4b4b4; --splash-bg: #262626; }
      }
      html[data-theme="dark"] { background: #262626; --splash-ink: #f2f2f2; --splash-dim: #b4b4b4; --splash-bg: #262626; }
      #splash {
        position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center;
        gap: 8px; background: var(--splash-bg); color: var(--splash-ink); transition: opacity 180ms ease-out;
        font: 600 17px/1.5 "Figtree Splash", -apple-system, sans-serif; letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }
      #splash[data-hide] { opacity: 0; pointer-events: none; }
      #splash svg { width: 22px; height: 22px; flex-shrink: 0; }
      #splash b { font-weight: 500; color: var(--splash-dim); margin-left: 0.3em; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
    <!-- The saved Light or Dark choice, applied before the first paint. A file, not inline: see public/_headers. -->
    <script src="/boot.js"></script>

    <div id="splash" aria-hidden="true">

      <span>OpenQuote<b>AU</b></span>
