<!-- Supabase → Authentication → Emails: use this body for both "Magic link" and "Confirm sign up".
     Subject: Your OpenQuote AU code: {{ .Token }} -->
<div style="margin:0;padding:32px 16px;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
  <div style="max-width:420px;margin:0 auto;background:#ffffff;border-radius:14px;padding:32px 28px;text-align:center;">
    <p style="margin:0 0 24px;font-size:17px;font-weight:700;letter-spacing:-0.01em;">OpenQuote<span style="font-weight:500;color:#71717a;"> AU</span></p>
    <p style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#3f3f46;">Your sign-in code</p>
    <p style="margin:0 0 20px;font-size:36px;font-weight:700;letter-spacing:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#18181b;">{{ .Token }}</p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#71717a;">Type it into OpenQuote AU to sign in. It works once and expires in an hour.<br>Didn't ask for it? You can ignore this email.</p>
  </div>
</div>
