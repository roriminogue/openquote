services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: openquote
      POSTGRES_PASSWORD: openquote
      POSTGRES_DB: openquote
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openquote"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openquote
      MINIO_ROOT_PASSWORD: openquote-dev
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox for viewing sent proposals/reminders

volumes:
  pgdata:
  miniodata:
